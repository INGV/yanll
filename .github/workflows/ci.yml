# yanll CI. On every push: the JSON I/O tests with the INGV configuration and the example
# located end to end, each inside the freshly built image. The tests are the input check
# the researchers asked for: the observation file and the control file rendered from the
# JSON must be production's byte for byte, paths aside, for every fixture event in 1D and
# 3D; one event is then located to prove the chain runs. On develop and on release tags
# the tested sources are then published to Docker Hub.
#
# Two checks are not here because a runner cannot have their inputs: the reference check
# reads reference/ and the internal documents, which are not in the repository, and the
# comparison with production needs the 3D model body and the grids. Both run by hand
# (README, Checking and Comparing with production).
name: ci

on:
  push:
    branches: ['**']
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - run: docker compose run --rm yanll python3 -m unittest discover -s /tests -v

  check-example:
    runs-on: ubuntu-latest
    env:
      YANLL_CONFIG: ./config/example
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - run: docker compose run --rm yanll /scripts/check-example.sh

  # The image tested above was built on another runner and cannot be handed over: this
  # job rebuilds it from the same pinned sources, with the OCI labels set from the run,
  # and pushes it. develop -> :develop; vX.Y.Z -> :X.Y.Z and :latest; any other ref has
  # no publish job (the only tags that start a run are the release ones, see `on`).
  # Credentials are the repository secrets DOCKER_HUB_USERNAME and
  # DOCKER_HUB_ACCESS_TOKEN, never printed.
  publish:
    needs: [test, check-example]
    if: github.ref == 'refs/heads/develop' || github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build, log in and push
        env:
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          DOCKER_HUB_ACCESS_TOKEN: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            TAGS="${VERSION} latest"
          else
            VERSION="develop"
            TAGS="develop"
          fi
          echo "publishing ingv/yanll with tags: ${TAGS}"
          docker build --platform linux/amd64 --build-arg "SOURCE=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" --build-arg "REVISION=${GITHUB_SHA}" --build-arg "VERSION=${VERSION}" -t yanll:publish .
          printf '%s' "${DOCKER_HUB_ACCESS_TOKEN}" | docker login -u "${DOCKER_HUB_USERNAME}" --password-stdin
          for TAG in ${TAGS}; do
            docker tag yanll:publish "ingv/yanll:${TAG}"
            docker push "ingv/yanll:${TAG}"
          done
          docker logout
