# yanll CI. On every push: the phase-1 reference check and the JSON I/O tests inside
# the freshly built image. The tests are the input check the researchers asked for:
# the observation file and the control file written from the JSON must be production's
# byte for byte, paths aside, for every fixture event in 1D and 3D; one event is then
# located to prove the chain runs. The comparison with production needs hours of grid
# generation, so it is a manual job that keeps the report as an artifact.
#
# The docker jobs use docker-in-docker, which needs a privileged runner: the shared
# INGV runners (grunner1, grunner2) are set up that way, as spada-v2 already relies on.

stages:
  - check
  - test
  - compare

check-reference:
  stage: check
  image: debian:bookworm-slim
  script:
    - scripts/check-reference.sh

.docker:
  image: docker:27.4.1
  services:
    - docker:27.4.1-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: tcp://docker:2375
    DOCKER_DRIVER: overlay2
  before_script:
    - docker --version
    - docker compose version
    - docker compose build

test:
  extends: .docker
  stage: test
  script:
    - docker compose run --rm yanll python3 -m unittest discover -s /opt/yanll/tests -v

compare:
  extends: .docker
  stage: compare
  when: manual
  timeout: 8h
  script:
    - docker compose run --rm yanll yanll-compare
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - docs/comparison-report.md
      - docs/comparison-table.md
      - docs/comparison-table.json
