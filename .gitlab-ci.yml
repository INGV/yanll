# yanll CI. On every push: the phase-1 reference check, the JSON I/O tests with the INGV
# configuration and the example located end to end, each inside the freshly built
# image. The tests are the input check the researchers asked for: the observation file
# and the control file rendered from the JSON must be production's byte for byte, paths
# aside, for every fixture event in 1D and 3D; one event is then located to prove the
# chain runs. The comparison with production needs the 3D model body and hours of grid
# generation, so it is a manual job that keeps the report as an artifact and is
# meaningful only on a runner that has the data. On develop and on release tags the
# tested image is published to Docker Hub.
#
# The docker jobs use docker-in-docker, which needs a privileged runner: the shared
# INGV runners (grunner1, grunner2) are set up that way, as spada-v2 already relies on.
#
# The jobs that run the image share one resource group, so they run one at a time
# across pipelines: the shared DockerSwarm runner checks every job of this project out
# in the same /builds/nll/yanll (a volume, so that the dind daemon sees the compose
# mounts), and two of them running at once clobber each other, the checkout of one
# wiping the data/ the other is locating in (seen on 2026-10-18, both failure modes).
# It costs about a minute per pipeline. The manual comparison stays out of the group:
# its hours would queue every push behind it.

stages:
  - check
  - test
  - compare
  - publish

check-reference:
  stage: check
  image: debian:bookworm-slim
  script:
    - scripts/check-reference.sh

.docker:
  image: docker:27.4.1
  services:
    - docker:27.4.1-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: tcp://docker:2375
    DOCKER_DRIVER: overlay2
  before_script:
    - docker --version
    - docker compose version
    - docker compose build

test:
  extends: .docker
  stage: test
  resource_group: docker
  script:
    - docker compose run --rm yanll python3 -m unittest discover -s /tests -v

check-example:
  extends: .docker
  stage: test
  resource_group: docker
  variables:
    YANLL_CONFIG: ./config/example
  script:
    - docker compose run --rm yanll /scripts/check-example.sh

compare:
  extends: .docker
  stage: compare
  when: manual
  timeout: 8h
  script:
    - docker compose run --rm yanll /tests/yanll-compare
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - docs/comparison-report.md
      - docs/comparison-table.md
      - docs/comparison-table.json

# The project has no container registry, so the image tested above cannot be handed
# over: this job rebuilds it from the same pinned sources, with the OCI labels set from
# the pipeline, and pushes it. develop -> :develop; vX.Y.Z -> :X.Y.Z and :latest; any
# other ref has no publish job. Credentials are the project CI variables
# DOCKER_HUB_USERNAME and DOCKER_HUB_ACCESS_TOKEN, never printed.
publish:
  extends: .docker
  stage: publish
  resource_group: docker
  needs:
    - check-reference
    - test
    - check-example
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/
  before_script:
    - docker --version
  script:
    - |
      if [ -n "${CI_COMMIT_TAG}" ]; then
        VERSION="${CI_COMMIT_TAG#v}"
        TAGS="${VERSION} latest"
      else
        VERSION="develop"
        TAGS="develop"
      fi
      echo "publishing ingv/yanll with tags: ${TAGS}"
    - docker build --platform linux/amd64 --build-arg "SOURCE=${CI_PROJECT_URL}" --build-arg "REVISION=${CI_COMMIT_SHA}" --build-arg "VERSION=${VERSION}" -t yanll:publish .
    - printf '%s' "${DOCKER_HUB_ACCESS_TOKEN}" | docker login -u "${DOCKER_HUB_USERNAME}" --password-stdin
    - |
      for TAG in ${TAGS}; do
        docker tag yanll:publish "ingv/yanll:${TAG}"
        docker push "ingv/yanll:${TAG}"
      done
    - docker logout
